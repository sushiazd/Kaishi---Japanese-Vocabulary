<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kaishi 1.5k</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kaishi">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f4f2ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Klee+One:wght@400;600&family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>/* Look « EsirPrac » : papier / encre, titres Source Serif 4, texte Inter, accent stylo bleu.
   Layout : app d'étude sur un écran — barre du haut avec les trois compteurs Anki, carte centrée, barre de réponse au pouce.
   Les noms de variables (--line, --ai, --learn, --rev…) sont lus par le JS : ne pas les renommer. */
:root{
  color-scheme:light;
  --paper:#f4f2ec; --surface:#fffefb; --surface-2:#f8f6f1; --ink:#1c1b19; --ink-2:#55524b; --muted:#878379;
  --line:#e4e0d6; --line-strong:#cdc8bb;
  --ai:#2446c8; --ai-hover:#1c389f; --ai-ink:#FFFFFF; --ai-soft:#eaeefc; --ai-line:#bccaf5;
  --new:#2446c8; --learn:#c2352b; --rev:#11773a; --hard:#9a5b00; --flag:#d4700a; --flag-soft:#fdf0e1;
  --dv:#2446c8; --ns:#c2352b;
  --shadow:0 1px 2px rgba(28,27,25,.05),0 10px 30px -18px rgba(28,27,25,.25);
  --serif:"Source Serif 4","Iowan Old Style","Palatino Linotype","Shippori Mincho B1",Georgia,serif;
  --sans:"Inter","Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-jp-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-kanji:"Klee One","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-ui:var(--sans);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --paper:#121211; --surface:#1b1b19; --surface-2:#222220; --ink:#f1eee7; --ink-2:#c3bfb5; --muted:#8f8b82;
  --line:#2e2d2a; --line-strong:#45433e;
  --ai:#7592ff; --ai-hover:#91a8ff; --ai-ink:#0d1433; --ai-soft:#1c2340; --ai-line:#34437a;
  --new:#7592ff; --learn:#ff6b5e; --rev:#52c774; --hard:#f0b64d; --flag:#ff9d42; --flag-soft:#382512;
  --dv:#7592ff; --ns:#ff6b5e;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 14px 34px -18px rgba(0,0,0,.7)}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#121211; --surface:#1b1b19; --surface-2:#222220; --ink:#f1eee7; --ink-2:#c3bfb5; --muted:#8f8b82;
  --line:#2e2d2a; --line-strong:#45433e;
  --ai:#7592ff; --ai-hover:#91a8ff; --ai-ink:#0d1433; --ai-soft:#1c2340; --ai-line:#34437a;
  --new:#7592ff; --learn:#ff6b5e; --rev:#52c774; --hard:#f0b64d; --flag:#ff9d42; --flag-soft:#382512;
  --dv:#7592ff; --ns:#ff6b5e;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 14px 34px -18px rgba(0,0,0,.7)}

[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--paper)}
body{height:100%;margin:0;overscroll-behavior:none}
body{background:var(--paper);color:var(--ink);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
#app{height:100%;display:flex;flex-direction:column}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:680px;margin:0 auto;width:100%}

/* barre du haut */
.bar{border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--paper) 90%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);position:relative;z-index:10}
.bar .wrap{display:flex;align-items:center;gap:12px;min-height:60px;padding-block:8px}
.brand{display:flex;align-items:center;gap:11px;min-width:0;background:none;border:0;padding:0;text-align:left}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font:600 18px/1 var(--f-jp-display);flex:none}
.brand-txt{min-width:0}
.brand strong{display:block;font:600 15px/1.2 var(--sans);white-space:nowrap}
.brand small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.counts{margin-left:auto;display:flex;gap:4px;font:700 15px/1 var(--sans)}
.counts span{min-width:34px;height:28px;padding:0 9px;border-radius:999px;display:grid;place-items:center}
.c-new{color:var(--new)} .c-learn{color:var(--learn)} .c-rev{color:var(--rev)}
.counts .on{background:color-mix(in srgb,currentColor 13%,transparent)}
.icon-btn{border:1px solid var(--line-strong);background:var(--surface);width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--ink);flex:none}
.icon-btn svg{width:20px;height:20px}

/* scène */
.stage{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.stage .wrap{padding-block:24px 32px}

/* accueil */
.eyebrow{font:600 12px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ai);margin-bottom:10px}
.home h1{font:600 clamp(32px,8.5vw,44px)/1.08 var(--serif);letter-spacing:-.02em;margin:0;text-wrap:balance}
.home h1 [lang="ja"]{font-family:var(--f-jp-display);font-weight:800;letter-spacing:.02em;margin-right:.12em}
.lede{font:italic 17.5px/1.5 var(--serif);color:var(--ink-2);margin:10px 0 22px;max-width:560px}
.today{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow);display:grid;gap:18px}
.today-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.today-row div{display:grid;gap:4px;padding:2px 0 2px 14px;border-left:3px solid var(--k,var(--line))}
.today-row div:nth-child(1){--k:var(--new)} .today-row div:nth-child(2){--k:var(--learn)} .today-row div:nth-child(3){--k:var(--rev)}
.today-row strong{font:800 clamp(30px,8vw,38px)/1 var(--sans);letter-spacing:-.03em}
.today-row small{color:var(--ink-2);font-size:13px}
.primary{width:100%;border:1px solid var(--ai);border-radius:12px;background:var(--ai);color:var(--ai-ink);font:600 16px/1.2 var(--sans);min-height:52px;padding:12px 16px}
.primary:disabled{opacity:.45;cursor:default}
.meter{display:grid;gap:8px;padding-top:16px;border-top:1px solid var(--line)}
.meter-top{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2)}
.meter-top span:last-child{font-weight:600;color:var(--ink)}
.meter-track{height:10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;display:flex}
.meter-track i{display:block;height:100%}
.m-mature{background:var(--rev)} .m-young{background:color-mix(in srgb,var(--rev) 45%,var(--surface))} .m-learn{background:var(--learn)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-2)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0;background:var(--k)}
.links{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.ghost{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;min-height:40px;padding:8px 16px;font:600 14px/1.2 var(--sans);color:var(--ink)}

/* cartes-outils de l'accueil (comme les matières d'EsirPrac) */
.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
.tool{position:relative;display:grid;gap:8px;align-content:start;padding:18px;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);text-align:left;transition:border-color .15s,transform .15s;min-width:0}
.tool .ic{width:40px;height:40px;border-radius:11px;background:var(--ai-soft);color:var(--ai);display:grid;place-items:center;font:600 20px/1 var(--f-jp-display)}
.tool h2{font:600 18px/1.2 var(--serif)}
.tool p{color:var(--ink-2);font-size:13.5px;line-height:1.45}
.tool .when{position:absolute;top:16px;right:16px;height:24px;display:inline-flex;align-items:center;padding:0 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font:600 12px/1 var(--sans);color:var(--ink-2);white-space:nowrap}
.tool .go{font:600 13.5px/1 var(--sans);color:var(--ai);margin-top:2px}
.tools .tool:last-child:nth-child(odd){grid-column:1/-1}
@media (max-width:360px){.tools{grid-template-columns:1fr}}

.sync{font-size:12.5px;color:var(--muted);margin-top:18px;display:flex;align-items:center;gap:8px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync.ok i{background:var(--rev)}
.tip{margin-top:16px;font:15px/1.6 var(--serif);color:var(--ink-2);padding:12px 16px;border-left:3px solid var(--ai);background:var(--surface-2);border-radius:0 10px 10px 0}
.tip b{color:var(--ink)}

/* carte d'étude */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:30px 20px 24px;text-align:center;position:relative}
.tagline{position:absolute;top:12px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;height:22px;font:600 11.5px/1 var(--sans);border-radius:999px;padding:0 9px;background:color-mix(in srgb,currentColor 12%,transparent)}
.word{font-family:var(--f-jp-display);font-weight:800;font-size:clamp(46px,13vw,72px);line-height:1.25;margin:24px 0 8px;letter-spacing:.02em;word-break:keep-all;overflow-wrap:anywhere}
.word rt{font-family:var(--sans);font-size:.3em;font-weight:500;color:var(--muted);letter-spacing:.05em}
.sent{font-size:clamp(19px,5.2vw,23px);line-height:1.9;margin:4px 0 0;overflow-wrap:anywhere}
.sent b{color:var(--ai);font-weight:700}
.sent rt{font-size:.52em;color:var(--muted)}
.back{margin-top:6px}
.meaning{font:600 23px/1.3 var(--serif);margin:0;text-wrap:balance}
.pos{font-size:13px;color:var(--muted);margin:4px 0 0}
.sep{height:1px;background:var(--line);margin:20px -4px}
.trans{color:var(--ink-2);margin:6px 0 0;font:italic 17px/1.5 var(--serif)}
.audio{display:flex;justify-content:center;gap:8px;margin-top:16px;flex-wrap:wrap}
.audio button{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;min-height:36px;padding:0 14px;font:600 13.5px/1 var(--sans)}
.audio svg{width:14px;height:14px;color:var(--ai)}
.extras{text-align:left;margin-top:18px;display:grid;gap:10px}
.box{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:14.5px;line-height:1.6}
.box h4{margin:0 0 6px;font:700 11px/1 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
details.box summary{cursor:pointer;font:600 14px/1.4 var(--sans);color:var(--ai);list-style:none}
details.box summary::-webkit-details-marker{display:none}
details.box summary::before{content:"▸ ";color:var(--muted)}
details.box[open] summary::before{content:"▾ "}
details.box div{margin-top:6px}
.pitch{font-size:22px;letter-spacing:.08em;font-family:var(--sans)}
.pw{display:inline-block;position:relative}
.pw.pd{padding-right:.1em;margin-right:.1em}
.pw .ol{position:absolute;top:.1em;left:0;right:0;height:0;border-top:.1em solid currentColor;pointer-events:none}
.pw .ol.dn{right:-.1em;height:.4em;border-right:.1em solid currentColor}
.dv{color:var(--dv)} .ns{color:var(--ns)} .ov{text-decoration:overline}

/* barre de réponse */
.answer{border-top:1px solid var(--line);background:color-mix(in srgb,var(--paper) 92%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.answer .wrap{padding-block:12px}
.show-btn{width:100%;border:1px solid var(--ai);border-radius:12px;background:var(--ai);color:var(--ai-ink);font:600 16px/1.2 var(--sans);min-height:52px;padding:12px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grade{border:1px solid var(--line-strong);background:var(--surface);border-radius:12px;padding:9px 4px 10px;display:grid;gap:3px;min-width:0;box-shadow:inset 0 3px 0 var(--k)}
.grade small{font:600 12px/1.2 var(--sans);color:var(--k)}
.grade span{font:600 14.5px/1.2 var(--sans)}
.grade:active{transform:translateY(1px)}
.g1{--k:var(--learn)} .g2{--k:var(--hard)} .g3{--k:var(--rev)} .g4{--k:var(--new)}
.kbd{display:none;text-align:center;font-size:12px;color:var(--muted);margin-top:8px}
@media (hover:hover) and (pointer:fine){.kbd{display:block}}

/* fin de session */
.done{text-align:center;padding-top:40px}
.done .big{font-family:var(--f-jp-display);font-size:56px;font-weight:800;margin:0}
.done h2{font:600 24px/1.25 var(--serif);margin-top:8px;text-wrap:balance}
.done p{color:var(--ink-2);margin-top:8px}
.done .tip{text-align:left}

/* feuilles */
.sheet-back{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:680px;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;border:1px solid var(--line);
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));box-shadow:var(--shadow)}
@media (min-width:700px){.sheet-back{align-items:center}.sheet{border-radius:18px;padding:22px 26px}}
.sheet header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sheet h2{margin:0;font:600 22px/1.25 var(--serif)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.row label{flex:1;min-width:0;font-weight:500}
.row label small{display:block;color:var(--muted);font-size:13px;font-weight:400}
.row input[type=number]{width:84px;font:inherit;min-height:40px;padding:6px 10px;border:1px solid var(--line-strong);border-radius:10px;background:var(--paper);color:var(--ink);text-align:right}
.row input[type=range]{width:140px;accent-color:var(--ai)}
.switch{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:99px;background:var(--line-strong);position:relative;flex:none;cursor:pointer;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch:checked{background:var(--ai)} .switch:checked::after{transform:translateX(18px)}
.danger{border:1px solid var(--learn);color:var(--learn);background:none;border-radius:10px;min-height:40px;padding:8px 14px;font:600 14px/1.2 var(--sans)}
.danger.armed{background:var(--learn);color:var(--surface)}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:6px 0 20px}
.stat{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat strong{display:block;font:800 26px/1.15 var(--sans);letter-spacing:-.03em;color:var(--ai)}
.stat small{color:var(--ink-2);font-size:12.5px}
.fc{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:120px;margin:10px 0 4px}
.fc div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.fc i{display:block;width:70%;background:var(--ai);border-radius:4px 4px 0 0;min-height:2px}
.fc b{font-size:12px;font-weight:700}
.fc-l{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;font-size:11.5px;color:var(--muted);text-align:center}
.search{width:100%;font:inherit;min-height:44px;padding:10px 12px;border:1px solid var(--line-strong);border-radius:10px;background:var(--paper);color:var(--ink);margin-bottom:8px}
.list{display:grid}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:11px 0;border-bottom:1px solid var(--line);align-items:center}
.li .w{font-family:var(--f-jp-display);font-weight:800;font-size:19px}
.li .w small{font-family:var(--sans);font-weight:400;font-size:13px;color:var(--muted);margin-left:6px}
.li .m{grid-column:1;color:var(--ink-2);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .s{grid-row:1/3;grid-column:2;display:grid;justify-items:end;gap:4px}
.li .s button{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:3px 9px;font-size:12px;color:var(--ink-2)}
.st-new{color:var(--new)} .st-learn{color:var(--learn)} .st-young{color:var(--rev)} .st-mature{color:var(--rev)} .st-susp{color:var(--muted)}
.menu{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:calc(62px + env(safe-area-inset-top,0px));background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;z-index:15;min-width:250px;display:grid}
.menu button{border:0;background:none;text-align:left;padding:10px 12px;border-radius:9px;font-size:15px}
.menu button:disabled{opacity:.4}
.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:14px;z-index:30;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow)}
.loading{display:grid;place-items:center;height:60vh;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.fade{animation:fade .18s ease-out}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}

/* ---------- choix du deck (onglets d'EsirPrac) ---------- */
.seg{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:24px}
.seg-btn{flex:1;border:0;background:none;border-radius:9px;min-height:40px;padding:0 12px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--ink-2);min-width:0}
.seg-btn b{font-family:var(--f-jp-display);font-weight:800;font-size:16px;white-space:nowrap}
@media (max-width:420px){.seg-btn b{display:none}}
.seg-btn span{font:600 14.5px/1 var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg-btn em{font:700 11px/1.2 var(--sans);font-style:normal;background:var(--flag);color:#fff;border-radius:999px;padding:2px 6px;min-width:18px}
.seg-btn.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* ---------- bande de kanji sur l'accueil ---------- */
.kstrip{display:flex;flex-wrap:wrap;gap:3px;margin-top:16px;padding:14px;border:1px solid var(--line);border-radius:18px;background:var(--surface);box-shadow:var(--shadow);width:100%;justify-content:center}
.kstrip span{font-family:var(--f-kanji);font-size:19px;width:27px;height:30px;display:grid;place-items:center;border-radius:6px;color:var(--muted)}
.kstrip .ks-new{opacity:.5}
.kstrip .ks-learn{color:var(--learn);background:color-mix(in srgb,var(--learn) 12%,transparent);opacity:1}
.kstrip .ks-young{color:var(--rev);background:color-mix(in srgb,var(--rev) 10%,transparent)}
.kstrip .ks-mature{color:var(--surface);background:var(--rev)}

/* ---------- carte kanji ---------- */
.kcard .chip.kind{color:var(--ink-2);margin-left:4px}
.kbig{font-family:var(--f-kanji);font-weight:600;font-size:clamp(110px,34vw,168px);line-height:1.15;margin:26px 0 4px}
.kbig.sm{font-size:64px;margin:12px 0 0}
.kq{color:var(--ink-2);margin:6px 0 0;font:italic 16px/1.5 var(--serif)}
.meaning.big{font-size:27px;margin-top:4px}
.kprompt{display:grid;gap:2px;margin:10px 0 12px}
.kp-w{font-family:var(--f-kanji);font-size:30px;font-weight:600}
.kp-w .blank{color:var(--ai)}
.kp-r{color:var(--ink-2);font-size:14.5px}
.readings{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 4px;text-align:left}
.readings div{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:9px 12px;min-width:0}
.rl{display:block;font:700 11px/1.4 var(--sans);letter-spacing:.1em;color:var(--ink-2)}
.rv{font-size:17px;font-weight:500;overflow-wrap:anywhere}
.parts{margin-top:6px;color:var(--muted);font-size:13.5px}
.exlist{display:grid;gap:2px;margin-top:4px}
.ex{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;align-items:baseline;gap:4px 10px;text-align:left;border:0;background:none;padding:6px 4px;border-radius:8px}
.ex-w{font-family:var(--f-kanji);font-weight:600;font-size:19px}
.ex-r{color:var(--muted);font-size:14px}
.ex-m{font-size:14px;overflow:hidden;text-overflow:ellipsis}
.ex svg{width:14px;height:14px;color:var(--ai);align-self:center}
.svg-wrap{display:grid;justify-items:center;gap:8px;margin-top:16px}
.ksvg{width:min(220px,62vw);aspect-ratio:1;background:var(--surface-2);border:1px solid var(--line);border-radius:14px}
.ksvg path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.kg-grid path{stroke:var(--line-strong);stroke-width:.6;stroke-dasharray:3 3}
.kg-ghost path{stroke:color-mix(in srgb,var(--ink) 12%,transparent);stroke-width:3.2}
.kg-ink path{stroke:var(--ink);stroke-width:3.4}
.kg-num text{font-size:8px;fill:var(--learn);font-family:var(--sans);font-weight:700}
.write-row{display:grid;justify-content:center;gap:10px;margin-top:6px}
.write-row.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.write-row figure{margin:0;display:grid;justify-items:center;gap:4px;min-width:0}
.write-row figcaption{font-size:12.5px;color:var(--muted)}
.pad{display:block;width:min(300px,78vw);aspect-ratio:1;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;touch-action:none;cursor:crosshair;color:var(--ink)}
.write-row.two .pad,.write-row.two .ksvg{width:100%;max-width:220px}
.pad-tools{display:flex;justify-content:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.ghost.sm{min-height:34px;padding:6px 12px;font-size:13px}

/* ---------- « Les kanji du mot » (verso du vocabulaire) ---------- */
.wk{display:grid;gap:8px}
.wk-k{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:start;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;font:inherit;color:inherit}
.wk-k b{font:600 34px/1.1 var(--f-kanji);text-align:center}
.wk-k strong{display:block;font:600 15.5px/1.35 var(--serif)}
.wk-k small{display:block;font-size:12.5px;line-height:1.45;color:var(--ink-2);margin-top:2px}
.wk-k small.wk-more{color:var(--ai);font-weight:600}

/* ---------- grille & fiche kanji ---------- */
.kgroup{font:600 12px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ai);margin:20px 0 10px}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.ktile{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:6px 2px 7px;display:grid;justify-items:center;gap:0;min-width:0}
.ktile b{font-family:var(--f-kanji);font-weight:600;font-size:30px;line-height:1.2}
.ktile small{font-size:11px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
.ktile.ks-learn{border-color:var(--learn);box-shadow:inset 0 -3px 0 var(--learn)}
.ktile.ks-young{border-color:color-mix(in srgb,var(--rev) 55%,var(--line));box-shadow:inset 0 -3px 0 color-mix(in srgb,var(--rev) 45%,var(--surface))}
.ktile.ks-mature{border-color:var(--rev);box-shadow:inset 0 -3px 0 var(--rev)}
.ktile.ks-susp{opacity:.5}
.kdetail{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.kdetail .svg-wrap{margin:0}
.kdetail .ksvg{width:min(180px,44vw)}
.kd-side{text-align:center}
.kd-st{display:grid;gap:2px;font-size:12.5px;font-weight:700;margin:6px 0 0}
.practice{margin-top:10px;text-align:center}
.practice h4{text-align:left}
.trace{display:flex;align-items:center;justify-content:center;gap:10px;font-size:14px;margin:6px 0 10px}
.practice-pad{position:relative;width:min(300px,78vw);aspect-ratio:1;margin:0 auto}
.practice-pad .ksvg,.practice-pad .pad{position:absolute;inset:0;width:100%;height:100%}
.practice-pad .ksvg{border:0;background:var(--surface-2)}
.practice-pad .pad{background:transparent}
.practice-pad .ksvg .kg-ink,.practice-pad .ksvg .kg-num{display:none}
.practice-pad .ksvg .kg-ghost path{stroke:color-mix(in srgb,var(--ai) 22%,transparent);stroke-width:4}
.practice-pad.no-trace .kg-ghost{display:none}
.sheet header{gap:8px}
.sheet header h2{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.set-h{font:600 12px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ai);margin:24px 0 2px}
.set-h:first-child{margin-top:0}

/* ---------- méthode ---------- */
.method .lead{font:italic 17px/1.55 var(--serif);color:var(--ink-2);margin:0 0 16px}
.method ol{padding-left:22px;margin:0;display:grid;gap:16px}
.method ol>li::marker{font:600 16px var(--serif);color:var(--ai)}
.method li h4{margin:0 0 4px;font:600 17px/1.3 var(--serif)}
.method li p{margin:4px 0;font-size:14.5px;line-height:1.65;color:var(--ink-2)}
.method .rules{margin:6px 0;padding-left:18px;font-size:14.5px;display:grid;gap:3px}
.method .rules li::marker{color:var(--ai)}

.credits{font-size:12px;color:var(--muted);margin-top:18px}
.credits a{color:inherit}

.sync.bad{color:var(--learn);align-items:flex-start;background:color-mix(in srgb,var(--learn) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--learn) 40%,var(--line));border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.5}
.sync.bad i{background:var(--learn);margin-top:6px}
.sync.bad b{color:var(--ink)}

/* ---------- leçons & quiz ---------- */
.kbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kbtns .primary{padding:12px 10px;font-size:15px}
.kbtns .primary.alt{background:var(--surface-2);color:var(--muted);border-color:var(--line);opacity:1}
.kbtns .gate{grid-column:1/-1;font-size:13px;line-height:1.45;color:var(--ink-2);text-align:center}
.les-head{display:grid;gap:10px;margin-bottom:14px}
.les-dots{display:flex;justify-content:center;gap:6px}
.les-dots span{font-family:var(--f-kanji);font-size:20px;width:40px;height:40px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.les-dots span.on{border-color:var(--ai);color:var(--ink);box-shadow:0 0 0 2px var(--ai-line)}
.les-dots span.ok{background:var(--ai-soft);color:var(--ai);border-color:transparent}
.les-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:4px}
.les-tabs button{border:0;background:none;border-radius:9px;min-height:36px;padding:0 4px;font:600 14px/1 var(--sans);color:var(--ink-2)}
.les-tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.les-step{text-align:center;font:600 12px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ai)}
.les-nav{display:flex;gap:8px}
.les-nav .show-btn{flex:1}
.les-nav .ghost{min-height:52px;padding:0 18px}
.les-nav .ghost:disabled{opacity:.4}
.les-write .tip{margin-top:12px}
.qword{font-family:var(--f-kanji);font-weight:600;font-size:clamp(54px,16vw,80px);line-height:1.2;margin:28px 0 4px}
.qword .hl{color:var(--ai);font-weight:600}
.qform{display:flex;gap:8px;margin:16px auto 0;max-width:420px}
.qin{flex:1;min-width:0;font:inherit;font-size:19px;min-height:52px;padding:10px 14px;border:2px solid var(--line-strong);border-radius:12px;background:var(--paper);color:var(--ink);text-align:center}
.qin-r{font-size:21px;letter-spacing:.04em}
.qin:focus{outline:none;border-color:var(--ai)}
.qgo{border:0;border-radius:12px;background:var(--ai);color:var(--ai-ink);width:54px;display:grid;place-items:center;flex:none}
.qgo svg{width:22px;height:22px}
.qform.is-ok .qin{border-color:var(--rev);background:color-mix(in srgb,var(--rev) 10%,var(--surface))}
.qform.is-bad .qin{border-color:var(--learn);background:color-mix(in srgb,var(--learn) 9%,var(--surface))}
.qform.is-ok .qgo,.qform.is-bad .qgo{display:none}
.qfb{min-height:8px;margin-top:10px}
.qfb p{margin:4px 0}
.qfb .ok{color:var(--rev);font-weight:700}
.qfb .bad{color:var(--learn);font-weight:700}
.qsol{font:16px/1.5 var(--serif)}
.qsol b{font-size:18px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}

/* ---------- résultats des révisions tapées ---------- */
.results{display:grid;gap:6px;margin:12px 0 4px;text-align:left}
.res{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0;padding:9px 14px;border-radius:10px;font-size:14.5px;border-left:3px solid var(--k)}
.res.ok{--k:var(--rev);background:color-mix(in srgb,var(--rev) 10%,var(--surface));color:var(--ink)}
.res.bad{--k:var(--learn);background:color-mix(in srgb,var(--learn) 9%,var(--surface));color:var(--ink)}
.res-l{font-weight:700;color:var(--k)}
.grades.two{grid-template-columns:1fr 1fr}
.grade.pri{border-width:2px;border-color:var(--k)}
.grade.typo small{color:var(--muted)}
.ghost.wide{width:100%;min-height:52px}

/* ---------- tablette vérifiée ---------- */
.padmsg{min-height:22px;margin:8px 0 0;font-size:14px;color:var(--muted);font-weight:600}
.padmsg.ok{color:var(--rev)} .padmsg.bad{color:var(--learn)}
.kcard .pad{margin:6px auto 0}
.les-pass{margin:0 0 8px;font-size:14px;color:var(--ink-2)}
.les-pass b{color:var(--ai)}

/* ---------- test de niveau ---------- */
.pt-card{display:grid;gap:6px;background:var(--flag-soft);border:1px solid color-mix(in srgb,var(--flag) 40%,transparent);border-radius:14px;padding:14px 16px;font-size:14.5px;color:var(--ink-2)}
.pt-card b{font:600 17px/1.3 var(--serif);color:var(--ink)}
.pt-card .ghost{justify-self:start;margin-top:4px}
.pt-head{display:grid;gap:8px;margin-bottom:12px}
.pt-top{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted)}
.pt-top b{color:var(--ink)}
.pt-tired{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:13.5px;color:var(--ink-2)}

/* survol : souris seulement. Sur iPhone, :hover reste collé là où on a tapé et surlignait le bouton du mot suivant. */
@media (hover:hover) and (pointer:fine){
  .icon-btn:hover{border-color:var(--ai)}
  .primary:hover:not(:disabled){background:var(--ai-hover)}
  .ghost:hover:not(:disabled){border-color:var(--ai)}
  .tool:hover{border-color:var(--ai);transform:translateY(-2px)}
  .audio button:hover{border-color:var(--ai)}
  .show-btn:hover{background:var(--ai-hover)}
  .grade:hover{border-color:var(--k)}
  .menu button:hover{background:var(--surface-2)}
  .kstrip:hover{border-color:var(--ai)}
  .ex:hover{background:var(--surface)}
  .ktile:hover{border-color:var(--ai)}
  button.wk-k:hover{border-color:var(--ai)}
}
</style>

<script id="deck" type="application/json">{"v":1,"grammar":["～ます<br>Forme polie des verbes.<br>Formation : forme en -i (連用形) du verbe + ます.","～くなかった<br>Passé négatif des adjectifs en -i.","～ました<br>Passé poli.","～て<br>Forme en -te. Plusieurs sens ; sert surtout à relier deux propositions.<br>Formation : forme euphonique (音便) du verbe + て ; radical de l'adjectif en -i + くて.","～う・よう<br>1. Volonté ou intention du locuteur<br>2. Invitation (« faisons… »)<br>3. (…ようとする) être sur le point de faire / essayer de faire<br>4. Supposition.<br>Formation : verbe ichidan (未然形) + よう ; verbe godan en -o + う ; adjectif en -i : radical + かろう (sens 4 seulement).","～ています<br>Forme polie de l'action en cours ou de l'état qui dure.","～ませんでした<br>Passé négatif poli.","～た<br>1. Fait passé<br>2. Action achevée<br>3. Confirmation (« ah, c'est vrai que… »)<br>4. Certitude que l'action aura lieu<br>5. Passé relatif à la proposition principale<br>6. Ordre adouci.<br>Formation : forme euphonique (音便) du verbe + た ; radical de l'adjectif en -i + かった.","～ましょう<br>Forme polie de la volonté ou de l'invitation (« faisons… »).","～ないで<br>Forme en -te négative (« sans faire… », « ne fais pas… »).","～たい<br>1. Envie, désir (« vouloir faire »)<br>2. Avec …たいと思います : exprime indirectement ce qu'on compte faire.<br>Formation : forme en -i (連用形) + たい ; たい se conjugue comme un adjectif en -i.","～ている<br>1. Action en cours ou qui dure jusqu'à un moment donné<br>2. Action terminée dont l'état résultant demeure<br>3. État résultant d'un changement.<br>Formation : forme en -te + いる. À l'oral, le い tombe souvent.","～ていました<br>Forme polie passée de l'action en cours ou de l'état qui dure.","～てしまいました<br>Passé poli de l'action complètement achevée (souvent avec regret).","～ていた<br>Passé de l'action en cours ou de l'état qui dure.","～られました<br>Passé poli du passif.","～てくれました<br>Forme en -te + くれる (quelqu'un fait quelque chose pour moi), au passé poli.","～ません<br>Négatif poli.","～られた<br>Passé du passif.","連用形 (forme en -i)<br>Ici, elle exprime une action (en cours).<br>C'est la forme du verbe devant ます, sans ます.","～ない<br>1. Forme négative du verbe<br>2. Invitation (« tu ne veux pas… ? »).<br>Formation : 未然形 du verbe + ない ; radical de l'adjectif en -i + くない. ない se conjugue comme un adjectif en -i ; poli : ません.","～く<br>Forme adverbiale des adjectifs en -i.","～(ら)れる<br>Forme potentielle : pouvoir faire.<br>Formation : verbe ichidan (未然形) + (ら)れる ; verbe godan : forme en -e + る. する → できる, くる → こ(ら)れる.","～ておきます<br>Forme en -te + おく (faire à l'avance, en prévision), forme polie.","～てしまった<br>Passé de l'action complètement achevée (souvent avec regret).","～た + ～ちゃう<br>Passé ～た (voir ce point) + ちゃう, contraction familière de てしまう (action achevée, souvent avec regret).","～た + ～ない + ～(ら)れる<br>Potentiel ～(ら)れる (pouvoir faire) + négatif ～ない + passé ～た : « n'a pas pu… ».","～ます + ～(ら)れる<br>Potentiel ～(ら)れる (pouvoir faire) à la forme polie ～ます : « peut… ».","～なさい<br>Ordre poli (souvent d'un adulte à un enfant).<br>Formation : forme en -i (連用形) + なさい.","～なかった<br>Passé négatif.","～てきました<br>Forme en -te + くる (venir / changement progressif), au passé poli.","～ていない<br>Négatif de l'action en cours ou de l'état (« ne pas encore avoir… »)."],"cards":[["私","わたし","je, moi (poli, neutre)","私[わたし]","<b>私<\/b>はアンです。","Je suis Anne.","<b>私[わたし]<\/b>はアンです。","Se lit aussi わたくし (très formel) et あたし (féminin, familier). Il existe d'autres lectures plus rares.","ワ<span class=\"pw\"><span>タシ<\/span><i class=\"ol\"><\/i><\/span>","",-1,"pronom"],["あなた","あなた","tu, vous (souvent quand on ne connaît pas le nom)","あなた","<b>あなた<\/b>はトムさんですか。","Vous êtes Tom ?","<b>あなた<\/b>はトムさんですか。","","ア<span class=\"pw pd\"><span>ナ<\/span><i class=\"ol dn\"><\/i><\/span>タ","",-1,"pronom"],["さん","さん","M. / Mme (suffixe de politesse)","さん","あなたはトム<b>さん<\/b>ですか。","Vous êtes M. Tom ?","あなたはトム<b>さん<\/b>ですか。","Le suffixe de politesse le plus courant et le plus neutre. Un peu comme « M. / Mme » devant un nom.","<span class=\"pw pd\"><span>サ<\/span><i cl <script>
"use strict";
/* ---------- constants (Anki defaults) ---------- */
const STEPS=[1,10], RELEARN=[10], GRAD_IVL=1, EASY_IVL=4, START_EASE=2500, MIN_EASE=1300,
      EASY_BONUS=1.3, HARD_MULT=1.2, MAX_IVL=36500, LEARN_AHEAD=20*60e3, LEECH=8, MATURE=21, CHUNK=100;
const DEFAULT_CFG={newPerDay:20,revPerDay:200,autoplay:true,sentenceFront:false,showPitch:false,rate:0.9,kNewPerDay:10,kRevPerDay:200,kWrite:true,kNums:true};
const KR=10000, KW=20000; // ids des cartes kanji : lecture / écriture
const LS_KEY="kaishi-fr-v1";
const MIN=60e3, DAY=864e5;

/* ---------- state ---------- */
let CARDS=[], GRAM=[], KANJI=[], KGROUPS=[], KV={}; // KV : sens et lectures des kanji des mots (kanji-vocab.json)
const S={cards:{},daily:{day:-1,n:0,r:0},dk:{day:-1,n:0,r:0},hist:{},histK:{},cfg:{...DEFAULT_CFG},cfgMod:0};
let view="loading", cur=null, shown=false, sinceNew=0, undoStack=[], REMOTE=null, deck="vocab", pad=null;
let VOCAB_IDS=[], KANJI_IDS=[];
const isK=id=>id>=KR, isKW=id=>id>=KW, kOf=id=>KANJI[id>=KW?id-KW:id-KR];
function deckOf(id){return id>=KR?"kanji":"vocab"}
function D(d=deck){ return d==="kanji"
  ? {ids:KANJI_IDS,newLim:S.cfg.kNewPerDay,revLim:S.cfg.kRevPerDay,dkey:"dk",hkey:"histK",name:"Kanji N5"}
  : {ids:VOCAB_IDS,newLim:S.cfg.newPerDay,revLim:S.cfg.revPerDay,dkey:"daily",hkey:"hist",name:"Kaishi 1.5k"}; }

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const furi=s=>s.replace(/ ?([^ >]+?)\[(.+?)\]/g,"<ruby>$1<rt>$2</rt></ruby>");

function today(now=Date.now()){const d=new Date(now);return Math.floor((now-d.getTimezoneOffset()*MIN-4*3600e3)/DAY)}

/* card state: [q,due,ivl,ease,reps,lapses,step,mod,susp,bury] */
const NEW={q:0,due:0,ivl:0,ease:0,reps:0,lapses:0,step:0,mod:0,susp:0,bury:-1};
const toArr=c=>[c.q,c.due,c.ivl,c.ease,c.reps,c.lapses,c.step,c.mod,c.susp,c.bury];
const fromArr=a=>({q:a[0],due:a[1],ivl:a[2],ease:a[3],reps:a[4],lapses:a[5],step:a[6],mod:a[7],susp:a[8]||0,bury:a[9]??-1});
const st=i=>S.cards[i]||NEW;

/* ---------- scheduler (Anki SM-2, v3 behaviour) ---------- */
function hash(n){n=(n^61)^(n>>>16);n=n+(n<<3)|0;n=n^(n>>>4);n=Math.imul(n,0x27d4eb2d);n=n^(n>>>15);return n>>>0}
function fuzzed(ivl,seed){
  ivl=Math.max(1,Math.round(ivl)); if(ivl<3) return Math.min(ivl,MAX_IVL);
  let d=1; for(const [a,b,f] of [[2.5,7,.15],[7,20,.1],[20,Infinity,.05]]) d+=f*Math.max(0,Math.min(ivl,b)-a);
  const lo=Math.max(2,Math.round(ivl-d)), hi=Math.min(MAX_IVL,Math.round(ivl+d));
  return hi<=lo?lo:lo+hash(seed)%(hi-lo+1);
}
function hardDelay(steps,i){
  if(i===0) return (steps.length>1?(steps[0]+steps[1])/2:Math.min(steps[0]*1.5,steps[0]+1440))*MIN;
  return steps[Math.min(i,steps.length-1)]*MIN;
}
function next(idx,c,btn,now){
  const t=today(now), seed=idx*7919+c.reps*104729+btn;
  const n={...c,reps:c.reps+1,mod:now,bury:-1};
  const grad=(ivl)=>{n.q=2;n.step=0;n.ivl=fuzzed(ivl,seed);n.due=t+n.ivl;if(!n.ease)n.ease=START_EASE;};
  if(c.q===0||c.q===1){
    const i=c.q===0?0:c.step;
    if(btn===1){n.q=1;n.step=0;n.due=now+STEPS[0]*MIN}
    else if(btn===2){n.q=1;n.step=i;n.due=now+hardDelay(STEPS,i)}
    else if(btn===3){ if(i+1>=STEPS.length) grad(GRAD_IVL); else {n.q=1;n.step=i+1;n.due=now+STEPS[i+1]*MIN} }
    else grad(EASY_IVL);
  } else if(c.q===2){
    const delay=Math.max(0,t-c.due), e=c.ease/1000;
    if(btn===1){n.lapses=c.lapses+1;n.ease=Math.max(MIN_EASE,c.ease-200);n.ivl=1;n.q=3;n.step=0;n.due=now+RELEARN[0]*MIN}
    else{
      const hard=Math.min(MAX_IVL,Math.max(c.ivl+1,Math.round(c.ivl*HARD_MULT)));
      const good=Math.min(MAX_IVL,Math.max(hard+1,Math.round((c.ivl+delay/2)*e)));
      const easy=Math.min(MAX_IVL,Math.max(good+1,Math.round((c.ivl+delay)*e*EASY_BONUS)));
      const seedR=idx*7919+c.reps*104729;
      const fh=fuzzed(hard,seedR+2), fg=Math.max(fh+1,fuzzed(good,seedR+3)), fe=Math.max(fg+1,fuzzed(easy,seedR+4));
      n.ivl=Math.min(MAX_IVL,btn===2?fh:btn===3?fg:fe); n.q=2; n.due=t+n.ivl;
      if(btn===2) n.ease=Math.max(MIN_EASE,c.ease-150);
      if(btn===4) n.ease=c.ease+150;
    }
  } else { // relearning
    const i=c.step;
    if(btn===1){n.step=0;n.due=now+RELEARN[0]*MIN}
    else if(btn===2){n.due=now+hardDelay(RELEARN,i)}
    else if(btn===3){ if(i+1>=RELEARN.length){n.q=2;n.step=0;n.ivl=Math.max(1,c.ivl);n.due=t+n.ivl} else {n.step=i+1;n.due=now+RELEARN[i+1]*MIN} }
    else {n.q=2;n.step=0;n.ivl=Math.max(1,c.ivl)+1;n.due=t+n.ivl}
  }
  return n;
}
function fmtIvl(n,now){
  let ms = n.q===2 ? Math.max(1,(n.due-today(now)))*DAY : n.due-now;
  const m=ms/MIN;
  if(m<1) return "<1 min";
  if(m<60) return Math.round(m)+" min";
  const h=m/60; if(h<24) return (Math.round(h*10)/10).toString().replace(".",",")+" h";
  const d=ms/DAY; if(d<30) return Math.round(d)+" j";
  const mo=d/30.4; if(mo<12) return (Math.round(mo*10)/10).toString().replace(".",",")+" mois";
  return (Math.round(d/365*10)/10).toString().replace(".",",")+" ans";
}

/* ---------- queue ---------- */
function daily(d=deck){const t=today(),k=D(d).dkey;if(!S[k]||S[k].day!==t)S[k]={day:t,n:0,r:0};return S[k]}
function writeReady(i,t){ // la carte d'écriture arrive quand la lecture est apprise, jamais le même jour
  const r=st(KR+i); return S.cfg.kWrite && r.q===2 && today(r.mod)<t; }
function freshList(d,limit,t){
  const out=[]; if(limit<=0) return out;
  if(d==="vocab"){ for(const id of VOCAB_IDS){ if(out.length>=limit) break; const c=st(id); if(c.q===0&&!c.susp&&c.bury!==t) out.push(id) } return out; }
  const rec=[], wr=[];
  for(let i=0;i<KANJI.length;i++){
    const r=st(KR+i), w=st(KW+i);
    if(w.q===0&&!w.susp&&w.bury!==t&&writeReady(i,t)) wr.push(KW+i);
  }
  while(out.length<limit&&(rec.length||wr.length)){ if(wr.length) out.push(wr.shift()); if(out.length<limit&&rec.length) out.push(rec.shift()); }
  return out;
}
function gather(now=Date.now(),d=deck){
  const t=today(now), dd=daily(d), cfg=D(d);
  const learnNow=[], learnSoon=[], rev=[];
  for(const i of cfg.ids){
    const c=st(i); if(c.susp||c.bury===t) continue;
    if(c.q===1||c.q===3){ if(c.due<=now) learnNow.push(i); else if(c.due<=now+LEARN_AHEAD) learnSoon.push(i); }
    else if(c.q===2){ if(c.due<=t) rev.push(i); }
  }
  const newLeft=Math.max(0,cfg.newLim-dd.n), revLeft=Math.max(0,cfg.revLim-dd.r);
  const fresh=freshList(d,newLeft,t);
  learnNow.sort((a,b)=>st(a).due-st(b).due); learnSoon.sort((a,b)=>st(a).due-st(b).due);
  rev.sort((a,b)=>st(a).due-st(b).due||hash(a+t)-hash(b+t));
  return {learnNow,learnSoon,rev:rev.slice(0,revLeft),fresh,revTotal:rev.length};
}
function pick(now=Date.now()){
  const g=gather(now);
  if(g.learnNow.length) return g.learnNow[0];
  const r=g.rev.length, n=g.fresh.length;
  if(r&&n){ const ratio=Math.max(1,Math.floor(r/n)); if(sinceNew>=ratio) return g.fresh[0]; return g.rev[0]; }
  if(r) return g.rev[0];
  if(n) return g.fresh[0];
  if(g.learnSoon.length) return g.learnSoon[0];
  return null;
}
function renderCounts(){
  const g=gather(), el=$("#counts");
  const learn=g.learnNow.length+g.learnSoon.length;
  const cq=cur==null?-1:st(cur).q;
  const nNew=g.fresh.length+(deck==="kanji"&&typeof lessonCount==="function"&&KANJI.length?lessonCount():0);
  el.innerHTML=`<span class="c-new ${cq===0?"on":""}" title="${deck==="kanji"?"Leçons et nouvelles":"Nouvelles"}">${nNew}</span><span class="c-learn ${cq===1||cq===3?"on":""}" title="En apprentissage">${learn}</span><span class="c-rev ${cq===2?"on":""}" title="À réviser">${g.rev.length}</span>`;
  return g;
}

/* ---------- audio (synthèse vocale japonaise de l'appareil ; Safari n'expose que ses voix de base) ---------- */
let voice=null;
function pickVoice(){ try{ const vs=speechSynthesis.getVoices().filter(v=>/^ja/i.test(v.lang)); voice=vs.find(v=>/Kyoko|O-?ren|Otoya|Hattori|Google/i.test(v.name))||vs[0]||null; }catch(e){} }
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
/* iPhone : « playback » évite que le bouton silencieux coupe la voix (Safari 16.4+) ;
   cancel() suivi tout de suite de speak() fait sauter la phrase, d'où le petit délai après un cancel ;
   les utterances sont gardées en mémoire, sinon elles peuvent être libérées avant d'être lues. */
try{ if(navigator.audioSession) navigator.audioSession.type="playback"; }catch(e){}
let utts=[], hushAt=0;
function hush(){ try{ if(speechSynthesis.speaking||speechSynthesis.pending){ speechSynthesis.cancel(); hushAt=Date.now(); } }catch(e){} }
function speak(texts){
  try{ hush();
    const go=()=>{ try{ if(!voice) pickVoice(); speechSynthesis.resume(); utts=[];
      for(const t of texts){ if(!t) continue; const u=new SpeechSynthesisUtterance(t); u.lang="ja-JP"; if(voice)u.voice=voice; u.rate=S.cfg.rate;
        u.onerror=e=>{ if(e.error!=="canceled"&&e.error!=="interrupted") toast(`L'audio n'a pas pu être lu (${e.error}).`); };
        utts.push(u); speechSynthesis.speak(u); }
      }catch(e){toast("La lecture audio n'est pas disponible sur cet appareil.")} };
    if(Date.now()-hushAt<120) setTimeout(go,120); else go();
  }catch(e){toast("La lecture audio n'est pas disponible sur cet appareil.")}
}
const plain=s=>s.replace(/<[^>]+>/g,"").replace(/[AB]「/g,"「");
const wordSay=c=>c[1].split(/[・、]/)[0];

/* ---------- persistence ---------- */
function snapshotLocal(){
  const cards={}; for(const k in S.cards) cards[k]=toArr(S.cards[k]);
  return {v:1,cards,daily:S.daily,dk:S.dk,hist:S.hist,histK:S.histK,cfg:S.cfg,cfgMod:S.cfgMod};
}
let STORAGE_OK=true, lastSaved=0;
function checkStorage(){try{const k="kaishi-test";localStorage.setItem(k,"1");const ok=localStorage.getItem(k)==="1";localStorage.removeItem(k);return ok}catch(e){return false}}
function saveLocal(){
  try{ const raw=JSON.stringify({...snapshotLocal(),deck}); localStorage.setItem(LS_KEY,raw);
    if(localStorage.getItem(LS_KEY)!==raw) throw new Error("not kept");
    STORAGE_OK=true; lastSaved=Date.now(); }
  catch(e){ if(STORAGE_OK){STORAGE_OK=false; renderSync();} }
}
function loadLocal(){
  try{const raw=localStorage.getItem(LS_KEY); if(!raw) return; const o=JSON.parse(raw);
    for(const k in o.cards) S.cards[k]=fromArr(o.cards[k]);
    if(o.daily) S.daily=o.daily; if(o.dk) S.dk=o.dk; if(o.hist) S.hist=o.hist; if(o.histK) S.histK=o.histK;
    S.cfgMod=o.cfgMod||0; // o.deck est ignoré : le deck kanji séparé n'est plus proposé
    if(o.cfg&&S.cfgMod) S.cfg={...DEFAULT_CFG,...o.cfg}; // réglages jamais touchés (cfgMod 0) : on suit les défauts actuels
  }catch(e){}
}
const dirty=new Set(); let flushTimer=null, flushing=false;
function changed(idx){
  if(idx!=null) dirty.add("k"+Math.floor(idx/CHUNK));
  dirty.add("meta"); saveLocal();
  if(REMOTE){clearTimeout(flushTimer);flushTimer=setTimeout(flush,1500)}
}
function chunkBody(k){const c={};for(const key in S.cards){const i=+key; if(i>=k*CHUNK&&i<(k+1)*CHUNK) c[key]=toArr(S.cards[key]);} return {c}}
function chunkIds(){const s=new Set();for(const i of VOCAB_IDS.concat(KANJI_IDS)) s.add("k"+Math.floor(i/CHUNK));return [...s]}
function metaBody(){return {daily:S.daily,dk:S.dk,hist:S.hist,histK:S.histK,cfg:S.cfg,cfgMod:S.cfgMod}}
async function flush(){
  if(!REMOTE||flushing) return; flushing=true;
  try{ while(dirty.size){
      const k=dirty.values().next().value; dirty.delete(k);
      const body=k==="meta"?metaBody():chunkBody(+k.slice(1));
      try{ await REMOTE.col.doc(k).set(body); }
      catch(e){ const code=e&&e.code;
        if(code==="unavailable"||code==="resource_exhausted"){dirty.add(k);setTimeout(flush,4000+Math.random()*3000);break}
        if(code==="quota_exceeded"){toast("Le stockage en ligne est plein : la progression reste sur cet appareil.");REMOTE=null;break}
        REMOTE=null; break; }
  } } finally { flushing=false; renderSync(); }
}
async function pull(){
  if(!REMOTE) return false;
  const ids=["meta",...chunkIds()];
  const snaps=await Promise.all(ids.map(id=>REMOTE.col.doc(id).get().catch(()=>null)));
  let changedAny=false;
  snaps.forEach((s,j)=>{
    const id=ids[j];
    if(!s||!s.exists){ if(id!=="meta"&&Object.keys(chunkBody(+id.slice(1)).c).length) dirty.add(id); if(id==="meta") dirty.add("meta"); return; }
    const d=s.data();
    if(id==="meta"){
      if(d.cfg&&(d.cfgMod||0)>S.cfgMod){S.cfg={...DEFAULT_CFG,...d.cfg};S.cfgMod=d.cfgMod;changedAny=true}
      else if(S.cfgMod>(d.cfgMod||0)) dirty.add("meta");
      for(const dk of ["daily","dk"]){ const R=d[dk], L=S[dk]; if(!R) continue;
        if(R.day>L.day){S[dk]=R;changedAny=true}
        else if(R.day===L.day){const n=Math.max(L.n,R.n),r=Math.max(L.r,R.r); if(n!==L.n||r!==L.r)changedAny=true; S[dk]={day:L.day,n,r}} }
      for(const hk of ["hist","histK"]) if(d[hk]) for(const day in d[hk]){const a=d[hk][day],b=S[hk][day]||[0,0,0,0];S[hk][day]=a.map((v,x)=>Math.max(v,b[x]||0))}
      dirty.add("meta"); return;
    }
    const remote=d.c||{}, k=+id.slice(1); let localNewer=false;
    for(const key in remote){ const r=fromArr(remote[key]), l=S.cards[key];
      if(!l||r.mod>l.mod){S.cards[key]=r;changedAny=true} else if(l.mod>r.mod) localNewer=true; }
    for(const key in S.cards){const i=+key; if(i>=k*CHUNK&&i<(k+1)*CHUNK&&!remote[key]) localNewer=true;}
    if(localNewer) dirty.add(id);
  });
  saveLocal();
  if(dirty.size){clearTimeout(flushTimer);flushTimer=setTimeout(flush,800)}
  return changedAny;
}
async function connect(){
  try{
    const use=window.claude&&window.claude.use?window.claude.use.bind(window.claude):null; if(!use) return;
    const [db,user]=await Promise.all([use("db"),use("user")]);
    if(!db||!user) return;
    const uid=await user.id(); if(!uid) return;
    REMOTE={col:db.collection("data/users/"+uid)};
    const ch=await pull(); renderSync();
    if(ch) refresh();
  }catch(e){REMOTE=null; renderSync();}
}
function renderSync(){const el=$("#sync"); if(!el) return;
  const seen=Object.keys(S.cards).filter(k=>S.cards[k].q!==0).length;
  if(REMOTE){el.className="sync ok";el.innerHTML="<i></i>Progression synchronisée avec ton compte (iPhone, PC…)";return}
  if(!STORAGE_OK){el.className="sync bad";el.innerHTML=`<i></i><span><b>Ce navigateur n'enregistre pas ta progression</b> : elle sera perdue au rechargement. C'est le cas en navigation privée, ou si les cookies sont bloqués (iPhone : Réglages › Safari › désactiver « Bloquer tous les cookies »). Le plus sûr : ajoute l'app sur l'écran d'accueil et ouvre-la depuis l'icône.</span>`;return}
  el.className="sync ok";
  el.innerHTML=`<i></i>Progression enregistrée sur cet appareil${seen?` (${seen} carte${seen>1?"s":""} vue${seen>1?"s":""})`:""}. Fais une sauvegarde de temps en temps (Réglages).`;}

function stats(d=deck){
  let nw=0,learn=0,young=0,mature=0,susp=0;
  for(const i of D(d).ids){const c=st(i); if(c.susp){susp++;continue}
    if(c.q===0)nw++; else if(c.q===1||c.q===3)learn++; else if(c.ivl>=MATURE)mature++; else young++;}
  return {nw,learn,young,mature,susp,N:D(d).ids.length};
}

function animateStrokes(svg){
  if(!svg) return; const ps=[...svg.querySelectorAll(".kg-ink path")], ns=[...svg.querySelectorAll(".kg-num text")];
  if(reduceMotion()){ ps.forEach(p=>{p.style.strokeDasharray="";p.style.strokeDashoffset=""}); ns.forEach(n=>n.style.opacity=1); return; }
  const token=(svg._tok=(svg._tok||0)+1);
  ps.forEach(p=>{const L=p.getTotalLength(); p.style.transition="none"; p.style.strokeDasharray=L+" "+L; p.style.strokeDashoffset=L;});
  ns.forEach(n=>{n.style.transition="none";n.style.opacity=0});
  svg.getBoundingClientRect();
  let delay=150;
  ps.forEach((p,i)=>{const L=p.getTotalLength(), dur=Math.max(280,L*13);
    setTimeout(()=>{ if(svg._tok!==token) return;
      p.style.transition=`stroke-dashoffset ${dur}ms cubic-bezier(.4,0,.6,1)`; p.style.strokeDashoffset=0;
      if(ns[i]){ns[i].style.transition="opacity .2s";ns[i].style.opacity=1} },delay);
    delay+=dur+160; });
}

function makePad(canvas,strokes,opts={}){
  const ctx=canvas.getContext("2d"); let drawing=null;
  const css=()=>getComputedStyle(document.body);
  function size(){const r=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1; canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr); redraw();}
  function guides(){const W=canvas.width,H=canvas.height; ctx.save(); ctx.strokeStyle=css().getPropertyValue("--line").trim()||"#ccc"; ctx.lineWidth=Math.max(1,W/300); ctx.setLineDash([W/40,W/40]);
    ctx.beginPath(); ctx.moveTo(W/2,0); ctx.lineTo(W/2,H); ctx.moveTo(0,H/2); ctx.lineTo(W,H/2); ctx.stroke(); ctx.restore();}
  function line(s){ if(!s.length) return; const W=canvas.width; ctx.lineWidth=W*0.042; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle=css().color;
    ctx.beginPath(); ctx.moveTo(s[0][0]*W,s[0][1]*W);
    if(s.length===1){ctx.lineTo(s[0][0]*W+0.1,s[0][1]*W)}
    for(let i=1;i<s.length;i++){const p=s[i-1],q=s[i]; ctx.quadraticCurveTo(p[0]*W,p[1]*W,(p[0]+q[0])/2*W,(p[1]+q[1])/2*W)}
    const l=s[s.length-1]; ctx.lineTo(l[0]*W,l[1]*W); ctx.stroke(); }
  function redraw(){ctx.clearRect(0,0,canvas.width,canvas.height); guides(); strokes.forEach(line);}
  const pt=e=>{const r=canvas.getBoundingClientRect();return [Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))]};
  if(!opts.readOnly){
    canvas.addEventListener("pointerdown",e=>{e.preventDefault(); try{canvas.setPointerCapture(e.pointerId)}catch(_){} drawing=[pt(e)]; strokes.push(drawing); redraw(); opts.onChange&&opts.onChange();});
    canvas.addEventListener("pointermove",e=>{ if(!drawing) return; e.preventDefault(); const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e]; for(const ev of evs) drawing.push(pt(ev)); redraw(); });
    const end=()=>{drawing=null}; canvas.addEventListener("pointerup",end); canvas.addEventListener("pointercancel",end);
  }
  size(); return {redraw,size,clear(){strokes.length=0;redraw();opts.onChange&&opts.onChange()},undo(){strokes.pop();redraw();opts.onChange&&opts.onChange()}};
}

  const now=Date.now(), t=today(now), prev=st(cur), d=deckOf(cur), cfg=D(d), dd=daily(d), H=S[cfg.hkey];
  undoStack.push({idx:cur,prev:S.cards[cur]?{...S.cards[cur]}:null,dkey:cfg.dkey,daily:{...dd},hkey:cfg.hkey,hist:H[t]?[...H[t]]:null,sinceNew});

/* --- romaji -> hiragana (saisie des lectures) --- */
const RK=(()=>{const t={a:"あ",i:"い",u:"う",e:"え",o:"お"};
  const rows={k:"かきくけこ",g:"がぎぐげご",s:"さしすせそ",z:"ざじずぜぞ",t:"たちつてと",d:"だぢづでど",n:"なにぬねの",h:"はひふへほ",b:"ばびぶべぼ",p:"ぱぴぷぺぽ",m:"まみむめも",r:"らりるれろ"};
  for(const c in rows) for(let i=0;i<5;i++) t[c+"aiueo"[i]]=rows[c][i];
  Object.assign(t,{ya:"や",yu:"ゆ",yo:"よ",wa:"わ",wo:"を",wi:"うぃ",we:"うぇ",shi:"し",chi:"ち",tsu:"つ",fu:"ふ",ji:"じ",
    fa:"ふぁ",fi:"ふぃ",fe:"ふぇ",fo:"ふぉ",ja:"じゃ",ju:"じゅ",jo:"じょ",je:"じぇ",sha:"しゃ",shu:"しゅ",sho:"しょ",she:"しぇ",
    cha:"ちゃ",chu:"ちゅ",cho:"ちょ",che:"ちぇ",va:"ゔぁ",vi:"ゔぃ",vu:"ゔ",ve:"ゔぇ",vo:"ゔぉ",thi:"てぃ",dhi:"でぃ",
    xa:"ぁ",xi:"ぃ",xu:"ぅ",xe:"ぇ",xo:"ぉ",la:"ぁ",li:"ぃ",lu:"ぅ",le:"ぇ",lo:"ぉ",xtsu:"っ",ltsu:"っ",xtu:"っ",ltu:"っ",
    xya:"ゃ",xyu:"ゅ",xyo:"ょ",lya:"ゃ",lyu:"ゅ",lyo:"ょ","-":"ー"});
  const y={k:"き",g:"ぎ",n:"に",h:"ひ",b:"び",p:"ぴ",m:"み",r:"り",s:"し",z:"じ",t:"ち",c:"ち",d:"ぢ",j:"じ"}, sm={a:"ゃ",u:"ゅ",o:"ょ",e:"ぇ"};
  for(const c in y) for(const v of "auoe") t[c+"y"+v]=y[c]+sm[v];
  return t;})();
const RK_PREFIX=(()=>{const p=new Set();for(const k in RK) for(let i=1;i<=k.length;i++) p.add(k.slice(0,i));return p})();
function toKana(s,final){
  let out="",i=0;
  while(i<s.length){
    const lo=s[i].toLowerCase();
    if(!/[a-z'\-]/.test(lo)){out+=s[i];i++;continue}
    const nx=(s[i+1]||"").toLowerCase();
    if(lo==="n"){
      if(!nx){ out+=final?"ん":s[i]; i++; continue; }
      if(nx==="'"){out+="ん";i+=2;continue}
      if(nx==="n"){ const n2=(s[i+2]||"").toLowerCase(); out+="ん"; i+=/[aiueoy]/.test(n2)?1:2; continue; }
      if(!/[aiueoy]/.test(nx)){out+="ん";i++;continue}
    }
    if(lo===nx&&/[bcdfghjkmpqrstvwxz]/.test(lo)){out+="っ";i++;continue}
    if(lo==="t"&&nx==="c"){out+="っ";i++;continue}
    let m=null; for(const L of [4,3,2,1]){const seg=s.substr(i,L).toLowerCase(); if(seg.length===L&&RK[seg]){m=seg;break}}
    if(m){out+=RK[m];i+=m.length;continue}
    const rest=s.slice(i).toLowerCase();
    if(!final&&RK_PREFIX.has(rest)){out+=s.slice(i);break}
    out+=s[i]; i++;
  }
  return out;
}
const kataToHira=s=>s.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
const normKana=s=>kataToHira(toKana(String(s).trim(),true)).replace(/[\s・。、,.　]/g,"");
function bindKana(input){ input.addEventListener("input",()=>{const v=input.value, c=toKana(v,false); if(c!==v) input.value=c;}); }

/* --- vérification du sens (français) --- */
function normFr(s){
  s=String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/œ/g,"oe").replace(/æ/g,"ae")
    .replace(/\(.*?\)/g," ").replace(/[’'`]/g," ").replace(/[^a-z0-9 ]/g," ").replace(/(\d) (?=\d)/g,"$1").replace(/\s+/g," ").trim();
  for(let n=0;n<2;n++) s=s.replace(/^(le|la|les|l|un|une|des|du|de|d|se|s|en|au|aux)\s+/,"");
  return s;
}
function lev(a,b){ if(a===b) return 0; const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let p=Array.from({length:n+1},(_,j)=>j); for(let i=1;i<=m;i++){ const c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; } return p[n]; }
function acceptedMeanings(k){ const set=new Set(); for(const x of k[1].split(/[;,/]/).concat(k[12]||[])){const n=normFr(x); if(n) set.add(n);} return [...set]; }
function checkMeaning(k,ans){
  const a=normFr(ans); if(!a) return {ok:false,empty:true};
  for(const acc of acceptedMeanings(k)){
    if(a===acc) return {ok:true};
    const tol=acc.length<=3?0:acc.length<=6?1:2;
    if(lev(a,acc)<=tol) return {ok:true,typo:true};
  }
  return {ok:false};
}

/* ===================== Bloc C : écriture vérifiée trait par trait ===================== */
let _sampler=null;
const SVGNS="http://www.w3.org/2000/svg";

    _sampler.style.cssText="position:absolute;left:-9999px;top:0;width:1px;height:1px;overflow:hidden"; document.body.appendChild(_sampler); }
  k._ms=k[9].map(d=>{ const p=document.createElementNS(SVGNS,"path"); p.setAttribute("d",d); _sampler.appendChild(p);
    const L=p.getTotalLength(), n=Math.max(8,Math.ceil(L/1.5)), pts=[];
    for(let i=0;i<=n;i++){const q=p.getPointAtLength(L*i/n); pts.push([q.x,q.y])}
    p.remove(); return pts; });

}
const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);

    else D+=d; }

}

function strokeMatch(u,m,off=[0,0],loose=false){

  const tol=Math.min(21,Math.max(11,8+Lm*0.13))*(loose?1.4:1), ratio=Lu/Lm;

/* trait attendu M[i] ; refuse si le tracé ressemble nettement plus à un autre trait pas encore écrit */
function strokeCheck(u,M,i,off,loose){

    const c=css(), W=canvas.width; ctx.clearRect(0,0,W,canvas.height);
    ctx.save(); ctx.strokeStyle=c.line; ctx.lineWidth=Math.max(1,W/300); ctx.setLineDash([W/40,W/40]); ctx.beginPath(); ctx.moveTo(W/2,0); ctx.lineTo(W/2,W); ctx.moveTo(0,W/2); ctx.lineTo(W,W/2); ctx.stroke(); ctx.restore();
    if(guide) M.forEach((m,j)=>{ if(j>=P.idx) poly(m,4.2,c.ai,.16); });
    for(let j=0;j<P.idx;j++) poly(M[j],4.4,c.ink);
    if(!P.done&&P.idx<M.length&&(P.hint||o.hintNext)){ const m=M[P.idx]; poly(m,4.6,c.ai,.42); ctx.save(); ctx.fillStyle=c.ai; ctx.beginPath(); ctx.arc(m[0][0]*sc,m[0][1]*sc,3.2*sc,0,7); ctx.fill(); ctx.restore(); }
    if(cur) poly(cur,4.4,c.ink); if(flash) poly(flash,4.4,c.bad,.9);
  }
  const pt=e=>{const r=canvas.getBoundingClientRect();return [Math.min(109,Math.max(0,(e.clientX-r.left)/r.width*109)),Math.min(109,Math.max(0,(e.clientY-r.top)/r.height*109))]};
  const say=(msg,kind)=>o.onMsg&&o.onMsg(msg,kind,P);
  function evaluate(u){
    if(P.done) return;
    const r=strokeCheck(u,M,P.idx,P.off,P.offs.length===0);
    if(r.ok){
      const cu=centroid(resample(u,24)), cm=centroid(resample(M[P.idx],24)); P.offs.push([cu[0]-cm[0],cu[1]-cm[1]]);
      const av=P.offs.reduce((a,q)=>[a[0]+q[0],a[1]+q[1]],[0,0]).map(x=>Math.max(-12,Math.min(12,x/P.offs.length))); P.off=av;
      P.idx++; P.miss=0; P.hint=false;
      if(P.idx>=M.length){ P.done=true; draw(); say(P.mistakes?`Terminé, avec ${P.mistakes} erreur${P.mistakes>1?"s":""}.`:"Parfait, aucune erreur !","ok"); o.onDone&&o.onDone(P); return; }
      say(`Trait ${P.idx+1} sur ${M.length}`,"info");
    } else {
      P.mistakes++; P.miss++;
      let msg="Pas tout à fait.";
      if(r.reversed) msg="Bon trait, mais tracé dans le mauvais sens.";
      else if(r.order) msg="Ce trait vient plus tard : respecte l'ordre.";
      else for(let j=P.idx+1;j<M.length;j++) if(strokeMatch(u,M[j],P.off).ok){ msg="Ce trait vient plus tard : respecte l'ordre."; break; }
      if(P.miss>=2&&!P.hint){ P.hint=true; msg+=" Regarde l'indice."; }
      flash=u; setTimeout(()=>{flash=null;draw()},450); say(msg,"bad");
    }
    draw();
  }
  if(!o.readOnly){
    canvas.addEventListener("pointerdown",e=>{ if(P.done) return; e.preventDefault(); try{canvas.setPointerCapture(e.pointerId)}catch(_){} cur=[pt(e)]; draw(); });
    canvas.addEventListener("pointermove",e=>{ if(!cur) return; e.preventDefault(); const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e]; for(const ev of evs) cur.push(pt(ev)); draw(); });
    const end=()=>{ if(!cur) return; const u=cur; cur=null; evaluate(u); };
    canvas.addEventListener("pointerup",end); canvas.addEventListener("pointercancel",()=>{cur=null;draw()});
  }
  size(); if(!P.done) say(`Trait ${P.idx+1} sur ${M.length}`,"info");
  return {state:P,size,draw,
    hint(){ if(P.done||P.hint) return; P.hint=true; P.mistakes++; draw(); say("Indice affiché (compte comme une erreur).","info"); },
    reveal(){ if(P.done) return; P.gaveUp=true; P.idx=M.length; P.done=true; draw(); o.onDone&&o.onDone(P); },
    reset(){ Object.assign(P,{idx:0,mistakes:0,miss:0,hint:false,done:false,gaveUp:false,off:[0,0],offs:[]}); draw(); say(`Trait 1 sur ${M.length}`,"info"); },
    setGuide(b){ guide=b; draw(); } };
}
function checkPadHTML(id,extra=""){ return `<canvas class="pad" id="${id}" aria-label="Zone d'écriture"></canvas><p class="padmsg" id="${id}Msg" aria-live="polite"></p>${extra}`; }
function padMsgFn(id){ return (msg,kind)=>{ const el=document.getElementById(id+"Msg"); if(el){ el.textContent=msg; el.className="padmsg "+(kind||""); } }; }

/* --- carte d'écriture en révision --- */
function writeGrade(P){ if(P.gaveUp||P.mistakes>=3) return [1,2]; if(P.mistakes>0) return [2,3]; return [3,4]; }
function renderKanjiWrite(noAudio){
  const k=kOf(cur), s=st(cur); renderCounts();
  if(!pad||pad.id!==cur) pad={id:cur,state:null};
  const ex=k[7][0], blank=esc(ex[0]).split(k[0]).join(`<span class="blank">◯</span>`);
  let html=`<article class="card kcard fade" aria-live="polite"><div class="tagline"><span>${statusChip(s)} <span class="chip kind">Écriture</span></span><span class="num">${k[8]} trait${k[8]>1?"s":""}</span></div>
    <p class="kq">Écris le kanji qui veut dire</p><p class="meaning big">${esc(k[1])}</p>
    <p class="kprompt"><span class="kp-w">${blank}</span><span class="kp-r">${esc(ex[1])} · ${esc(ex[2])}</span></p>`;
  if(!shown){
    html+=`${checkPadHTML("padMain")}<div class="pad-tools"><button class="ghost sm" id="wHint">Indice</button></div>`;
  } else {
    const P=pad.state||{mistakes:0,gaveUp:true};
    const sum=P.gaveUp?`<p class="res bad"><span class="res-l">✗ Modèle affiché</span><span class="res-v">À revoir</span></p>`:P.mistakes?`<p class="res bad"><span class="res-l">${P.mistakes} erreur${P.mistakes>1?"s":""}</span><span class="res-v">${P.mistakes>=3?"À revoir":"Difficile"}</span></p>`:`<p class="res ok"><span class="res-l">✓ Sans faute</span><span class="res-v">tous les traits dans l'ordre</span></p>`;
    html+=`<div class="results">${sum}</div><div class="svg-wrap">${kanjiSVG(k)}<button class="ghost sm" id="replay">Rejouer l'ordre des traits</button></div>
      <div class="kbig sm">${k[0]}</div>${kanjiInfoHTML(k)}`;
  }
  html+=`</article>`;
  $("#view").innerHTML=html; $("#stage").scrollTop=0;
  const a=$("#answer"), inner=$("#answerInner"); a.hidden=false;
  if(!shown){
    const pp=PADS.padMain=makeCheckPad($("#padMain"),k,{state:pad.state,onMsg:padMsgFn("padMain"),
      onDone:P=>{ pad.state=P; setTimeout(()=>{ if(cur===pad.id&&!shown){ shown=true; renderKanjiWrite(); } },P.gaveUp?0:650); }});
    pad.state=pp.state;
    $("#wHint").onclick=()=>pp.hint();
    inner.innerHTML=`<button class="ghost wide" id="wGive">Je ne sais pas · montrer le modèle</button>`;
    $("#wGive").onclick=()=>pp.reveal();
  } else {
    const [g1,g2]=writeGrade(pad.state||{gaveUp:true}), L=["","À revoir","Difficile","Correct","Facile"];
    inner.innerHTML=`<div class="grades two">${gradeBtnHTML(g1,L[g1],"pri","kPrimary")}${gradeBtnHTML(g2,L[g2])}</div><div class="kbd">Entrée : ${L[g1]}</div>`;
    inner.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>answer(+b.dataset.g));
    const svg=$(".kcard .ksvg"); animateStrokes(svg); $("#replay").onclick=()=>animateStrokes(svg);
    if(S.cfg.autoplay&&!noAudio) speak([ex[1]]);
  }
}

/* ===================== Bloc E : test de niveau ===================== */
let PT=null;
function startPlacement(){
  const list=lessonPool(); if(!list.length){ toast("Tous les kanji ont déjà commencé : pas besoin de test."); return; }
  PT={list,pos:0,stage:"m",known:[],unknown:[],streak:0,answered:false}; view="placement"; cur=null; LES=null; renderPlacement();
}
function ptHead(){ const n=PT.list.length; return `<div class="pt-head"><div class="pt-top num"><b>Test de niveau</b><span>${Math.min(PT.pos+1,n)} / ${n} · ${PT.known.length} connu${PT.known.length>1?"s":""}</span></div><div class="meter-track"><i class="m-mature" style="width:${(PT.pos/n*100).toFixed(1)}%"></i></div></div>`; }
function renderPlacement(){
  if(!PT) return renderHome();
  $("#counts").innerHTML=`<span class="c-new on" title="Test de niveau">${PT.list.length-PT.pos}</span>`;
  if(PT.pos>=PT.list.length) return finishPlacement();
  const i=PT.list[PT.pos], k=KANJI[i], ex=k[7][0]; PT.answered=false;
  const prompt=PT.stage==="m"?`<div class="kbig">${k[0]}</div><p class="kq">Que veut dire ce kanji ?</p>`:`<div class="qword">${wordHL(ex[0],k[0])}</div><p class="kq">Comment se lit ce mot ?</p>`;
  const tired=PT.streak>=8?`<div class="pt-tired"><span>Plusieurs kanji d'affilée inconnus : tu peux t'arrêter là, le reste arrivera en leçons.</span><button class="ghost sm" id="ptStop2">Terminer le test</button></div>`:"";
  $("#view").innerHTML=`<section class="lesson fade">${ptHead()}${tired}<article class="card kcard"><div class="tagline"><span class="chip kind">${PT.stage==="m"?"Sens":"Lecture"}</span><span></span></div>${prompt}${qFieldHTML(PT.stage)}</article>
    <p class="tip">Réponds seulement si tu sais vraiment. Un kanji est compté connu si tu trouves son sens et la lecture d'un mot.</p></section>`;
  const a=$("#answer"), inner=$("#answerInner"); a.hidden=false;
  inner.innerHTML=`<div class="les-nav"><button class="ghost" id="ptStop">Terminer</button><button class="show-btn" id="ptIdk">Je ne sais pas</button></div>`;
  $("#ptStop").onclick=finishPlacement; if($("#ptStop2")) $("#ptStop2").onclick=finishPlacement;
  const W=wireQuestion(PT.stage,v=>{
    const r=PT.stage==="m"?checkMeaning(k,v):checkReading(ex[1],v);
    PT.answered=true;
    const goOn=()=>{ if(!PT) return;
      if(PT.stage==="m"&&r.ok){PT.stage="r";}
      else { if(PT.stage==="r"&&r.ok){PT.known.push(i);PT.streak=0} else {PT.unknown.push(i);PT.streak++} PT.stage="m"; PT.pos++; }
      renderPlacement(); };
    inner.innerHTML=`<div class="les-nav"><button class="ghost" id="ptStop">Terminer</button><button class="show-btn" id="ptNext">Continuer</button></div>`;
    $("#ptStop").onclick=()=>{ if(PT.stage==="r"&&r.ok) PT.known.push(i); finishPlacement(); };
    $("#ptNext").onclick=goOn; setTimeout(()=>{try{$("#ptNext").focus({preventScroll:true})}catch(e){}},30);
    if(r.ok) PT._t=setTimeout(()=>{ if(PT&&PT.answered&&PT.list[PT.pos]===i) goOn(); },650);
    const sol=PT.stage==="m"?esc(k[1]):`${esc(ex[0])} se lit <b>${esc(ex[1])}</b>`;
    return {ok:r.ok,html:r.ok?`<p class="ok">Correct.</p><p class="qsol">${sol}</p>`:`<p class="bad">${r.empty?"Pas de réponse.":"Pas tout à fait."}</p><p class="qsol">${PT.stage==="m"?"Réponse : <b>"+sol+"</b>":sol}</p>`};
  });
  $("#ptIdk").onclick=()=>W.submit();
}
function finishPlacement(){
  if(!PT) return renderHome();
  clearTimeout(PT._t);
  const now=Date.now(), t=today(now), K=PT.known;
  K.forEach((i,n)=>{
    const ivl=4+(n%7);
    S.cards[KR+i]={...NEW,q:2,ivl,ease:START_EASE,reps:1,due:t+ivl,mod:now};
    if(S.cfg.kWrite) S.cards[KW+i]={...NEW,q:1,step:1,ease:START_EASE,due:dayStart(t+1+(n%7)),mod:now};
    changed(KR+i); changed(KW+i);
  });
  changed(null);
  const tested=PT.pos, left=lessonPool().length;
  PT=null; view="placementDone";
  $("#view").innerHTML=`<section class="done fade"><p class="big">${K.length}</p><h2>kanji déjà connus sur ${tested} testés</h2>
    <p>${K.length?`Ils sont marqués comme acquis : ils reviendront en révision d'ici 4 à 10 jours pour confirmer${S.cfg.kWrite?", et tu les écriras de mémoire au fil de la semaine":""}.`:"Aucun kanji n'a été marqué comme connu."} ${left?`Les ${left} autres arriveront en leçons, 5 par 5.`:""}</p>
    <div class="links" style="justify-content:center">${left?`<button class="primary" style="width:auto" id="ptLesson">Commencer une leçon</button>`:""}<button class="ghost" id="homeBtn">Accueil</button></div></section>`;
  $("#answer").hidden=true; renderCounts();
  if($("#ptLesson")) $("#ptLesson").onclick=startLesson;
  $("#homeBtn").onclick=renderHome;
}
/* ---------- misc ---------- */
let toastT=null; function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3200)}
document.addEventListener("keydown",e=>{
  if(e.target.closest("input,textarea")||!$("#sheet").hidden) return;
  if(e.target.closest("canvas")) return;
  if((e.key===" "||e.key==="Enter")&&e.target.closest("button")) return;
  if(view==="placement"&&PT){ if(PT.answered&&(e.key==="Enter"||e.key===" ")){e.preventDefault(); $("#ptNext")&&$("#ptNext").click();} return; }
  if(view==="lesson"&&LES){ if(LES.phase==="learn"){ if(e.key==="ArrowRight"||e.key==="Enter"||e.key===" "){e.preventDefault();lessonMove(1)} else if(e.key==="ArrowLeft") lessonMove(-1); }
    else if(LES.phase==="quiz"&&LES.answered&&(e.key==="Enter"||e.key===" ")){e.preventDefault(); $("#qNext")&&$("#qNext").click();} return; }
  if(view!=="study"||cur==null){ if(e.key===" "&&view==="home"&&$("#studyBtn")&&!$("#studyBtn").disabled){e.preventDefault();startStudy()} return; }
  if(isKW(cur)){ if(shown&&(e.key===" "||e.key==="Enter")){e.preventDefault(); $("#kPrimary")&&$("#kPrimary").click();} else if(e.key==="z"||e.key==="Z") undo(); return; }
  if(isK(cur)&&!isKW(cur)){ if(KQ&&KQ.id===cur&&KQ.stage==="done"&&(e.key===" "||e.key==="Enter")){e.preventDefault(); $("#kPrimary")&&$("#kPrimary").click();} else if(e.key==="z"||e.key==="Z") undo(); return; }
  if(e.key===" "||e.key==="Enter"){e.preventDefault(); shown?answer(3):reveal()}
  else if(shown&&["1","2","3","4"].includes(e.key)) answer(+e.key);
  else if(e.key==="z"||e.key==="Z") undo();
});
setInterval(()=>{ if(view==="study"&&cur==null) nextCard(); else if(view==="home"||view==="study") renderCounts(); },30000);

/* ---------- boot ---------- */
(async function boot(){
  STORAGE_OK=checkStorage(); loadLocal(); pickVoice();
  try{
    const d=JSON.parse(document.getElementById("deck").textContent); CARDS=d.cards; GRAM=d.grammar;
    const kd=JSON.parse(document.getElementById("kanji").textContent); KANJI=kd.kanji; KGROUPS=kd.groups;
    KV=JSON.parse(document.getElementById("kvocab").textContent);
    VOCAB_IDS=CARDS.map((_,i)=>i); KANJI_IDS=KANJI.map((_,i)=>KR+i).concat(KANJI.map((_,i)=>KW+i));
  }catch(e){ $("#view").innerHTML=`<div class="loading">Le deck n'a pas pu être chargé. Recharge la page.</div>`; return; }
  renderHome();
  connect();
  try{ navigator.storage&&navigator.storage.persist&&navigator.storage.persist(); }catch(e){}
  if("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
